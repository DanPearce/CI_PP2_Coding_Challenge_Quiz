name: CI and deploy

# Every pull request is tested. Every push to main that passes the tests is deployed to the server (see the server-ops repository,
# docs/guides/11-auto-deploy.md). Public repository: GitHub-hosted runners are free, and no self-hosted runner is ever attached to it.
on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7.0.1
      - name: Check every page and the files it points to
        run: |
          python3 - <<'PY'
          import re, sys, pathlib
          root = pathlib.Path('.')
          pages = sorted(root.glob('*.html'))
          assert (root / 'index.html').exists(), 'index.html is missing'
          assert (root / '404.html').exists(), '404.html is missing'
          bad = []
          for page in pages:
              text = page.read_text(encoding='utf-8', errors='replace')
              if '<title>' not in text.lower():
                  bad.append(f'{page}: no <title>')
              for ref in re.findall(r'(?:href|src)="([^"#?]+)', text):
                  if re.match(r'^(https?:|mailto:|tel:|//|data:|javascript:)', ref):
                      continue
                  if not (page.parent / ref).exists():
                      bad.append(f'{page}: missing file {ref}')
          print(f'{len(pages)} pages checked')
          if bad:
              print('\n'.join(bad)); sys.exit(1)
          PY

  deploy:
    needs: test
    # Only pushes to main (never pull requests, never forks) reach the server.
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 25
    environment: production
    concurrency:
      group: deploy-codingquiz
      cancel-in-progress: false
    steps:
      - name: Deploy this commit to the server
        env:
          DEPLOY_SSH_KEY: ${{ secrets.DEPLOY_SSH_KEY }}
          DEPLOY_HOST: ${{ vars.DEPLOY_HOST }}
          DEPLOY_HOST_KEY: ${{ vars.DEPLOY_HOST_KEY }}
        run: |
          set -euo pipefail
          install -d -m 700 ~/.ssh
          umask 077
          printf '%s\n' "$DEPLOY_SSH_KEY" > ~/.ssh/deploy_key
          printf '%s %s\n' "$DEPLOY_HOST" "$DEPLOY_HOST_KEY" > ~/.ssh/known_hosts
          # The server only accepts this key for "codingquiz" and only a 40-character commit id; it deploys it only if it is the tip of main.
          ssh -i ~/.ssh/deploy_key -o IdentitiesOnly=yes -o BatchMode=yes -o StrictHostKeyChecking=yes \
              -o ServerAliveInterval=30 -o ServerAliveCountMax=40 "portfolio-deploy@${DEPLOY_HOST}" "$GITHUB_SHA"
